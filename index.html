<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio Forge — open the app</title>
    <meta http-equiv="refresh" content="0; url=./docs/app/index.html" />
    <link rel="canonical" href="./docs/app/index.html" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #0a0b10 radial-gradient(900px 500px at 8% -10%, rgba(124,108,255,.18), transparent 60%);
        color: #cbd5e1; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .card { text-align: center; padding: 2rem; }
      .logo {
        width: 46px; height: 46px; border-radius: 12px; margin: 0 auto 1rem;
        display: grid; place-items: center; font-size: 20px; font-weight: 800; color: #0a0b10;
        background: linear-gradient(135deg, #7c6cff, #2dd4bf);
      }
      h1 { font-size: 1.05rem; margin: 0 0 .35rem; color: #fff; letter-spacing: -.01em; }
      p { margin: 0; font-size: .82rem; color: #94a3b8; }
      a { color: #a5b4fc; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">⌘</div>
      <h1>Opening Portfolio Forge…</h1>
      <p>
        If nothing happens, open <a href="./docs/app/index.html">docs/app/index.html</a>.<br />
        Developing? <code>npm install &amp;&amp; npm run dev</code>.
      </p>
    </div>
  </body>
</html>
